<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRKD | Recent Activity Logs</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../design/dashboard.css?v=26">
    <link rel="stylesheet" href="../design/components.css?v=7">
    <link rel="stylesheet" href="../design/activity-logs.css?v=1">
    <link rel="icon" type="image/png" href="../assets/Favicon.jpg">

    <!-- Applies the saved theme before the page is drawn, so the page never flashes the wrong colours. -->
    <script src="../javascript/theme.js?v=3"></script>
    <!-- Sends signed-out visitors to the login page before the page is drawn. -->
    <script src="../javascript/session.js?v=2"></script>
</head>

<body data-page="activity-logs" data-owner-only>

    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- SIDEBAR -->
    <nav class="sidebar" aria-label="Main navigation">

        <div class="logo-container">
            <img src="../assets/logo.png" alt="CRKD" class="logo-img">
        </div>

        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high" aria-hidden="true"></i>DASHBOARD</a>
        <a id="nav-products" href="products.html" class="nav-item"><i class="fa-solid fa-shirt" aria-hidden="true"></i>PRODUCTS</a>
        <a href="inventory.html" class="nav-item"><i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i>INVENTORY</a>
        <a href="transaction-logs.html" class="nav-item"><i class="fa-solid fa-receipt" aria-hidden="true"></i>AUDIT LOGS</a>
        <a id="nav-activity-logs" href="activity-logs.html" class="nav-item nav-active" aria-current="page"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>ACTIVITY LOGS</a>
        <a id="nav-exchange" href="exchange.html" class="nav-item"><i class="fa-solid fa-right-left" aria-hidden="true"></i>EXCHANGES</a>
        <a id="nav-sales-history" href="sales-history.html" class="nav-item"><i class="fa-solid fa-chart-line" aria-hidden="true"></i>SALES HISTORY</a>
        <a id="nav-discounts" href="discounts.html" class="nav-item"><i class="fa-solid fa-tags" aria-hidden="true"></i>DISCOUNTS</a>
        <a id="nav-staff-management" href="staff-management.html" class="nav-item"><i class="fa-solid fa-users" aria-hidden="true"></i>ACCOUNTS</a>
        <a id="nav-forecasting" href="forecasting.html" class="nav-item"><i class="fa-solid fa-chart-column" aria-hidden="true"></i>FORECASTING</a>

    </nav>

    <!--- MAIN CONTENT --->
    <div class="main">

        <!-- TOP HEADER (sticky) -->
        <header class="top-header">
            <div class="header-icons">

                <div id="forecastNotifications" class="forecast-notifications" hidden>
                    <button id="forecastNotificationButton" class="forecast-notification-button" type="button"
                        aria-label="Forecast notifications" aria-expanded="false" aria-controls="forecastNotificationPanel">
                        <i class="fa-solid fa-bell" aria-hidden="true"></i>
                        <span id="forecastNotificationCount" class="forecast-notification-count" hidden aria-hidden="true">0</span>
                    </button>
                    <div id="forecastNotificationPanel" class="forecast-notification-panel" hidden>
                        <h3>Forecast Notifications</h3>
                        <div id="forecastNotificationList" class="forecast-notification-list">
                            <p class="forecast-notification-empty">Loading notifications...</p>
                        </div>
                    </div>
                </div>

                <div class="profile-section">
                    <!-- The button is named by the signed-in user's name (layout.js fills .Owner). -->
                    <button type="button" class="profile-icon"
                        aria-haspopup="true" aria-expanded="false" aria-controls="profileCard">
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                        <span class="Owner">Main Owner</span>
                        <i class="fa-solid fa-chevron-down profile-chevron" aria-hidden="true"></i>
                    </button>

                    <div id="profileCard" class="profile-card" hidden>
                        <div class="profile-card-header">
                            <i class="fa-solid fa-user" aria-hidden="true"></i>
                            <span>Main Owner</span>
                        </div>

                        <div class="profile-card-body">
                            <a class="profile-menu-item" href="../page/PointofSale.html">
                                <i class="fa-solid fa-cash-register" aria-hidden="true"></i>
                                Switch to POS
                            </a>
                            <button type="button" class="profile-menu-item theme-toggle-button">Light Mode</button>
                            <button type="button" class="profile-menu-item" data-action="change-password">
                                <i class="fa-solid fa-key" aria-hidden="true"></i>
                                Change Password
                            </button>
                            <hr class="profile-menu-separator">
                            <button type="button" class="profile-menu-item profile-menu-item-danger" data-action="logout">
                                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                                Logout
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </header>

        <!-- CONTENT WRAPPER -->
        <main id="main-content" class="content-wrapper" tabindex="-1">

            <h1>RECENT ACTIVITY LOGS</h1>

            <div id="view-activity" class="content-section">

                <section class="data-table-panel" aria-label="Activity logs">

                    <form id="activityFilters" role="search" aria-label="Search and filter activity">
                        <div class="table-filters">
                            <div class="form-field activity-search-field">
                                <label for="activitySearch">Search</label>
                                <div class="search-box">
                                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                                    <input id="activitySearch" type="search" placeholder="Action, reference or name"
                                        autocomplete="off">
                                </div>
                            </div>
                            <div class="form-field">
                                <label for="typeFilter">Type</label>
                                <select id="typeFilter">
                                    <option value="">All types</option>
                                    <option value="Sale">Sales</option>
                                    <option value="Exchange">Exchanges</option>
                                    <option value="Product">Products</option>
                                    <option value="Discount">Discounts</option>
                                    <option value="Account">Accounts</option>
                                    <option value="Login">Logins &amp; logouts</option>
                                    <option value="Import">Imports</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label for="staffFilter">Staff</label>
                                <!-- activity-logs.js adds everyone who has an entry. -->
                                <select id="staffFilter">
                                    <option value="">All staff</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label for="fromDate">From</label>
                                <input id="fromDate" type="date">
                            </div>
                            <div class="form-field">
                                <label for="toDate">To</label>
                                <input id="toDate" type="date">
                            </div>
                            <button id="clearFilters" class="btn btn-ghost" type="button" hidden>
                                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                                Clear filters
                            </button>
                        </div>
                    </form>

                    <p id="activitySummary" class="table-summary" role="status" aria-live="polite">Loading activity...</p>

                    <div class="transaction-table-scroll">
                        <table class="transaction-table activity-table">
                            <thead>
                                <tr>
                                    <th scope="col">Date &amp; Time</th>
                                    <th scope="col">Staff Name</th>
                                    <th scope="col">Type</th>
                                    <th scope="col">Action</th>
                                </tr>
                            </thead>
                            <tbody id="activityTableBody"></tbody>
                        </table>
                    </div>

                    <nav id="activityPagination" class="pagination" aria-label="Activity pages"></nav>
                </section>

            </div>

        </main>
    </div>

    <script src="../javascript/ui.js?v=6"></script>
    <script src="../javascript/live.js?v=2"></script>
    <script src="../javascript/layout.js?v=9"></script>
    <script src="../javascript/account.js?v=4"></script>
    <script src="../javascript/activity-logs.js?v=1"></script>

</body>
</html>
