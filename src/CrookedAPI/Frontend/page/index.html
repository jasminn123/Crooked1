<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRKD | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../design/index.css?v=4">
    <link rel="stylesheet" href="../design/components.css?v=3">

    <!-- Applies the saved theme before the page is drawn, so the page never flashes the wrong colours. -->
    <script src="../javascript/theme.js?v=2"></script>
</head>
<body>

    <div class="login-toolbar">
        <button class="btn btn-secondary theme-toggle-button" type="button" onclick="toggleDarkMode()">Light Mode</button>
    </div>

    <main id="main-content" class="login-card" aria-labelledby="loginTitle" tabindex="-1">
        <div class="login-brand">
            <img src="../assets/logo.png" class="logo-img" alt="CRKD">
            <h1 id="loginTitle" class="login-title">Clothing Shop</h1>
        </div>

        <div class="login-body">
            <form id="loginForm" class="login-form" novalidate>
                <div class="form-field">
                    <label for="user">Username</label>
                    <input type="text" id="user" name="username" placeholder="Enter username"
                        autocomplete="username" autocapitalize="off" spellcheck="false" required>
                </div>

                <div class="form-field">
                    <label for="pass">Password</label>
                    <input type="password" id="pass" name="password" placeholder="Enter password"
                        autocomplete="current-password" required>
                </div>

                <button id="loginButton" class="btn btn-primary btn-block" type="submit">Log In</button>
            </form>

            <p id="message" class="form-message" role="status" aria-live="polite"></p>

            <div class="login-extras">
                <button id="forgot-password-link" class="link-button" type="button" aria-haspopup="dialog">Forgot password?</button>
            </div>
        </div>
    </main>

    <!-- OWNER RECOVERY MODAL -->
    <div id="reset-modal" class="modal" role="dialog" aria-modal="true"
        aria-labelledby="resetTitle" aria-describedby="resetDescription" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="resetTitle">Owner Recovery</h2>
                    <p id="resetDescription">Enter your username and master recovery key to set a new password.</p>
                </div>
                <button type="button" class="btn btn-ghost btn-icon" data-close-reset aria-label="Close owner recovery">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <form id="resetForm" class="modal-form" novalidate>
                <div class="form-field">
                    <label for="reset-username">Owner username</label>
                    <input type="text" id="reset-username" name="reset-username" autocomplete="username"
                        autocapitalize="off" spellcheck="false" required>
                </div>

                <div class="form-field">
                    <label for="recovery-key">Master recovery key</label>
                    <input type="password" id="recovery-key" name="recovery-key" autocomplete="off" required>
                </div>

                <div class="form-field">
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" name="new-password" autocomplete="new-password" required>
                </div>

                <p id="reset-msg" class="form-message" role="status" aria-live="polite"></p>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" data-close-reset>Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../javascript/ui.js?v=3"></script>
    <script src="../javascript/index.js?v=2"></script>
</body>
</html>
