<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point of Sale</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../design/PointofSale.css?v=17">
</head>
<body>

  <header class="pos-header">
    <div class="logo">CRKD</div>
    <div class="header-actions">
      <div class="profile-section">
        <i id="userIcon" class="fa-regular fa-user"></i>
        <div id="profileCard" class="profile-card">
          <div class="profile-card-header">
            <i class="fa-regular fa-user"></i>
            <span>Main Owner</span>
          </div>
          <div class="profile-card-body">
            <button onclick="window.location.href='../page/dashboard.html'">Switch to DASHBOARD</button>
            <button class="theme-toggle-button" type="button" onclick="toggleDarkMode()">Light Mode</button>
            <button onclick="window.location.href='../page/index.html'">LOGOUT</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="pos-main">
    <div class="product-catalog">
      <label class="pos-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="productSearch" type="search" placeholder="Search products..." autocomplete="off"
          aria-label="Search products">
      </label>
      <section class="product-grid" id="productGrid" aria-label="Products"></section>
    </div>

    <aside class="checkout-panel">
      <h2>Checkout</h2>
      <ul id="checkoutList" class="checkout-list"></ul>
      <div class="checkout-total">
        <strong>Total:</strong> <span id="checkoutTotal">&#8369;0.00</span>
      </div>
      <div class="checkout-actions">
        <button class="btn checkout">CHECK OUT</button>
        <button class="btn cancel" onclick="confirmCancelCheckout()">CANCEL</button>
      </div>
    </aside>
  </main>

  <!-- Modals outside main -->

  <div id="variantModal" class="modal" role="dialog" aria-modal="true"
    aria-labelledby="variantModalTitle" aria-hidden="true">
    <div class="modal-content variant-modal-content">
      <button id="closeVariantModalBtn" class="modal-close-btn" type="button" aria-label="Close product options">×</button>
      <h2 id="variantModalTitle">Choose product options</h2>
      <p id="variantProductName" class="variant-product-name"></p>
      <label class="variant-field">
        <span>Size</span>
        <select id="variantSize"></select>
      </label>
      <label class="variant-field">
        <span>Color</span>
        <select id="variantColor"></select>
      </label>
      <p id="variantAvailability" class="variant-availability" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="cancelVariantBtn" class="btn" type="button">Cancel</button>
        <button id="addVariantBtn" class="btn" type="button">Add to Checkout</button>
      </div>
    </div>
  </div>

  <div id="receiptModal" class="modal">
    <div class="modal-content">
      <button id="closeReceiptBtn" class="modal-close-btn" type="button" aria-label="Close receipt prompt">×</button>
      <h2>Do you want to print a receipt?</h2>
      <div class="modal-actions">
        <button id="receiptYesBtn" class="btn">YES</button>
        <button id="receiptNoBtn" class="btn">NO</button>
      </div>
    </div>
  </div>

  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <button id="closePaymentBtn" class="modal-close-btn" type="button" aria-label="Close payment method selection">×</button>
      <h3>Total Amount: <span id="modalTotal">&#8369;0.00</span></h3>
      <p>Select Payment Method:</p>
      <div class="modal-actions">
        <button id="cashBtn" class="btn">Cash</button>
        <button id="gcashBtn" class="btn">GCash</button>
      </div>
    </div>
  </div>

  <div id="cashModal" class="modal">
  <div class="modal-content">
    <button id="closeCashBtn" class="modal-close-btn" type="button" aria-label="Close cash payment">×</button>
    <h3>Total Amount: <span id="cashTotal">&#8369;0.00</span></h3>
    <input id="amountReceived" type="text" inputmode="decimal" maxlength="8" placeholder="Enter amount received" autocomplete="off">
    <p>Change: <span id="changeDisplay">&#8369;0.00</span></p>
    <div class="modal-actions">
      <button id="confirmCashBtn" class="btn">Confirm Payment</button>
      <button class="btn" onclick="hideModal('cashModal')">Cancel</button>
    </div>
  </div>
</div>

  <div id="gcashModal" class="modal">
    <div class="modal-content">
      <button id="closeGCashBtn" class="modal-close-btn" type="button" aria-label="Close GCash payment">×</button>
      <h3>Total Amount: <span id="gcashTotal">&#8369;0.00</span></h3>
      <input id="gcashRefId" type="text" placeholder="Enter Reference ID">
      <div class="modal-actions">
        <button id="confirmGCashBtn" class="btn">Confirm Payment</button>
        <button class="btn" onclick="hideModal('gcashModal')">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../javascript/theme.js?v=1"></script>
  <script src="../javascript/PointOfSale.js?v=9"></script>

</body>
</html>
